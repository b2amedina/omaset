<svg width="1600" height="520" viewBox="0 0 1600 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181414"/>
      <stop offset="0.55" stop-color="#211b1b"/>
      <stop offset="1" stop-color="#2c2525"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.0" r="0.85">
      <stop offset="0" stop-color="#f38d70" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f38d70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#241d1d" stop-opacity="0"/>
      <stop offset="0.10" stop-color="#241d1d" stop-opacity="1"/>
      <stop offset="0.90" stop-color="#241d1d" stop-opacity="1"/>
      <stop offset="1" stop-color="#241d1d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#glow)"/>

  <!-- brand, left justified -->
  <g font-family="JetBrainsMono Nerd Font, monospace">
    <text x="96" y="196" fill="#f38d70" font-size="104" font-weight="bold">omaset</text>
    <rect x="98" y="224" width="386" height="6" rx="3" fill="#f38d70" fill-opacity="0.85"/>
    <text x="98" y="292" fill="#e6d9db" font-size="30">The settings engine Omarchy has been missing.</text>
    <text x="98" y="338" fill="#72696a" font-size="20">Keyboard-first UI &#183; Lua CLI &#183; JSON protocol for agents</text>
  </g>

  <!-- the Omarchy bar, with omaset's settings icon at the left of the system icons -->
  <g>
    <rect x="60" y="392" width="1480" height="68" rx="17" fill="url(#barfade)"/>
    <rect x="60.5" y="392.5" width="1479" height="67" rx="16.5" fill="none" stroke="#3a2f2b" stroke-width="1" stroke-opacity="0.7"/>

    <g font-family="JetBrainsMono Nerd Font, monospace" text-anchor="middle">
      <!-- workspaces (left) -->
      <circle cx="132" cy="426" r="7" fill="#f38d70"/>
      <g fill="#72696a" font-size="21">
        <text x="184" y="434">2</text>
        <text x="232" y="434">3</text>
        <text x="280" y="434">4</text>
        <text x="328" y="434">5</text>
        <text x="376" y="434">6</text>
      </g>

      <!-- clock (center) -->
      <text x="800" y="434" fill="#e6d9db" font-size="21">Sun 18 Oct 12:07 PM</text>

      <!-- system icons (right); omaset's settings icon sits first, highlighted -->
      <rect x="1284" y="405" width="50" height="42" rx="13" fill="#f38d70" fill-opacity="0.18" stroke="#f38d70" stroke-width="1.6"/>
      <text x="1309" y="435" fill="#f38d70" font-size="23">&#xF013;</text>
      <text x="1362" y="434" fill="#c9bfc0" font-size="24">&#xF00AF;</text>
      <text x="1414" y="435" fill="#c9bfc0" font-size="22">&#xF091F;</text>
      <text x="1466" y="435" fill="#c9bfc0" font-size="22">&#xF028;</text>
      <text x="1516" y="434" fill="#c9bfc0" font-size="24">&#xF0085;</text>
    </g>
  </g>
</svg>
