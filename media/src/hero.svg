<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="0.55" stop-color="#161616"/>
      <stop offset="1" stop-color="#191919"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.03" cy="0.0" r="0.85">
      <stop offset="0" stop-color="#d99128" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#d99128" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g font-family="JetBrainsMono Nerd Font, monospace">
    <!-- name -->
    <text x="78" y="330" fill="#d99128" font-size="136" font-weight="bold">Omaset</text>
    <rect x="80" y="366" width="470" height="7" rx="3.5" fill="#d99128" fill-opacity="0.85"/>

    <!-- tagline -->
    <text x="80" y="458" fill="#e9e9e9" font-size="38">Omarchy's settings management,</text>
    <text x="80" y="508" fill="#e9e9e9" font-size="38">designed for the age of agents</text>
    <text x="80" y="558" fill="#e9e9e9" font-size="38">but usable for humans.</text>

    <!-- single bullet -->
    <g fill="#b5b3af" font-size="34">
      <text x="80" y="668">&#8226;  4.5 ready, in all 50 languages.</text>
    </g>
  </g>
</svg>
